[project]
name = "yt-tui"
version = "0.1.0"
description = "Split-pane terminal UI: YouTube live chat on the left, live Cursor agent activity on the right."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.0.0",
    "rich>=14.0.0",
    "pytchat-ng>=0.5.8",
    "httpx>=0.27.0",
    "emoji>=2.15.0",
    "paho-mqtt>=2.1.0",
]

[project.scripts]
yt-tui = "yt_tui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_tui"]
